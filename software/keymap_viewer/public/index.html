<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KERIgoKBD v2のキーマップ早見表">
  <title>Keymap Viewer</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main>
    <section class="keyboard-card" aria-labelledby="keyboard-name">
      <div class="section-heading">
        <div>
          <h1 id="keyboard-name">KERIgoKBD</h1>
          <p id="layout-version" class="layout-version"></p>
        </div>
      </div>
      <div id="keyboard" class="keyboard" role="group" aria-label="キーボードレイアウト"></div>
      <section class="legend" aria-label="表示とマウス操作の凡例">
        <h3 class="legend-title">凡例</h3>
        <div class="legend-key-guide" aria-label="Mainは上部中央、Mouseは中央、Numは左下、Fnは右下、Holdは下端">
          <span class="guide-main">Main</span>
          <span class="guide-nums">Num</span>
          <span class="guide-auto-mouse">Mouse</span>
          <span class="guide-func">Fn</span>
          <span class="guide-hold">Hold</span>
        </div>
        <div class="legend-layer-descriptions" aria-label="レイヤの説明">
          <span class="legend-layer-main"><b>Main</b><small>デフォルト状態のレイアウト</small></span>
          <span class="legend-layer-num"><b>Num</b><small>Numキーを押した状態のレイアウト</small></span>
          <span class="legend-layer-fn"><b>Fn</b><small>Fnキーを押した状態のレイアウト</small></span>
          <span class="legend-layer-mouse"><b>Mouse</b><small>Trackpadに触れている状態のレイアウト</small></span>
        </div>
        <div class="legend-column legend-clicks" aria-label="クリック操作">
          <span><b><svg class="operation-icon" aria-hidden="true">
                <use href="#icon-mouse-left"></use>
              </svg></b><small>左クリック</small></span>
          <span><b><svg class="operation-icon" aria-hidden="true">
                <use href="#icon-mouse-right"></use>
              </svg></b><small>右クリック</small></span>
          <span><b><svg class="operation-icon" aria-hidden="true">
                <use href="#icon-mouse-middle"></use>
              </svg></b><small>中クリック</small></span>
        </div>
        <div class="legend-column legend-mouse" aria-label="マウス操作">
          <span><b><svg class="operation-icon" aria-hidden="true">
                <use href="#icon-mouse"></use>
              </svg><svg class="operation-icon move-icon" aria-hidden="true">
                <use href="#icon-move"></use>
              </svg></b><small>ポインター移動</small></span>
          <span><b><svg class="operation-icon" aria-hidden="true">
                <use href="#icon-wheel"></use>
              </svg><svg class="operation-icon move-icon" aria-hidden="true">
                <use href="#icon-move"></use>
              </svg></b><small>ホイール移動</small></span>
        </div>
        <div class="legend-auto-section" aria-label="Mouseレイヤのアイコン">
          <div class="legend-auto-columns">
            <div class="legend-column legend-auto-clicks">
              <span><b><svg class="operation-icon" aria-hidden="true">
                    <use href="#icon-mouse-left"></use>
                  </svg></b><small>左クリック</small></span>
              <span><b><svg class="operation-icon" aria-hidden="true">
                    <use href="#icon-mouse-right"></use>
                  </svg></b><small>右クリック</small></span>
              <span><b><svg class="operation-icon" aria-hidden="true">
                    <use href="#icon-mouse-middle"></use>
                  </svg></b><small>中クリック</small></span>
            </div>
            <div class="legend-column legend-auto-actions">
              <span><b><svg class="operation-icon" aria-hidden="true">
                    <use href="#icon-scroll"></use>
                  </svg></b><small>スクロールモード</small></span>
              <span><b><svg class="operation-icon" aria-hidden="true">
                    <use href="#icon-zoom"></use>
                  </svg></b><small>ズームモード</small></span>
            </div>
          </div>
        </div>
      </section>
      <hr class="footer-divider">
      <footer class="copyright">©2026 KERI's Lab</footer>
    </section>
    <section class="control-pane" aria-label="表示と画像出力">
      <label class="layer-toggle" for="toggle-auto-mouse">
        <input id="toggle-auto-mouse" type="checkbox" checked>
        <span class="toggle-track" aria-hidden="true"><span></span></span>
        <span>Mouseレイヤを表示</span>
      </label>
      <div class="control-actions">
        <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
        <button id="copy-png" class="copy-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="8" y="8" width="11" height="11" rx="2"></rect>
            <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path>
          </svg>
          <span>PNGをコピー</span>
        </button>
      </div>
    </section>
  </main>
  <svg class="svg-definitions" aria-hidden="true">
    <defs>
      <symbol id="icon-mouse" viewBox="0 0 16 16">
        <rect x="3" y="1.25" width="10" height="13.5" rx="5"></rect>
        <path d="M8 1.5v5M3.5 6.5h9"></path>
      </symbol>
      <symbol id="icon-mouse-left" viewBox="0 0 16 16">
        <path class="click-mark" d="M8 1.25a5 5 0 0 0-5 5v.25h5Z"></path>
        <rect x="3" y="1.25" width="10" height="13.5" rx="5"></rect>
        <path d="M8 1.5v5M3.5 6.5h9"></path>
      </symbol>
      <symbol id="icon-mouse-right" viewBox="0 0 16 16">
        <path class="click-mark" d="M8 1.25a5 5 0 0 1 5 5v.25H8Z"></path>
        <rect x="3" y="1.25" width="10" height="13.5" rx="5"></rect>
        <path d="M8 1.5v5M3.5 6.5h9"></path>
      </symbol>
      <symbol id="icon-mouse-middle" viewBox="0 0 16 16">
        <rect x="3" y="1.25" width="10" height="13.5" rx="5"></rect>
        <path d="M3.5 6.5h9"></path>
        <rect class="click-mark" x="6.4" y="2.4" width="3.2" height="5.4" rx="1.6"></rect>
      </symbol>
      <symbol id="icon-wheel" viewBox="0 0 16 16">
        <rect x="3" y="1.25" width="10" height="13.5" rx="5"></rect>
        <rect class="wheel-mark" x="6.75" y="3" width="2.5" height="4.5" rx="1.25"></rect>
      </symbol>
      <symbol id="icon-move" viewBox="0 0 24 24">
        <path d="m12 1 5 5h-3v4h4V7l5 5-5 5v-3h-4v4h3l-5 5-5-5h3v-4H6v3l-5-5 5-5v3h4V6H7Z"></path>
      </symbol>
      <symbol id="icon-scroll" viewBox="0 0 24 24">
        <path d="M7 5h7M7 9h5M7 13h7M7 17h5"></path>
        <path d="M18 4v16m-3-3 3 3 3-3m0-10-3-3-3 3"></path>
      </symbol>
      <symbol id="icon-zoom" viewBox="0 0 24 24">
        <circle cx="10" cy="10" r="6"></circle>
        <path d="m14.5 14.5 5 5M10 7v6M7 10h6"></path>
      </symbol>
      <symbol id="icon-backspace" viewBox="0 0 24 24">
        <path d="M20 5.5H9.2L3 12l6.2 6.5H20a1.5 1.5 0 0 0 1.5-1.5V7A1.5 1.5 0 0 0 20 5.5Z"></path>
        <path d="m11 9 6 6m0-6-6 6"></path>
      </symbol>
      <symbol id="icon-delete" viewBox="0 0 24 24">
        <path d="M4 5.5h10.8L21 12l-6.2 6.5H4A1.5 1.5 0 0 1 2.5 17V7A1.5 1.5 0 0 1 4 5.5Z"></path>
        <path d="m13 9-6 6m0-6 6 6"></path>
      </symbol>
    </defs>
  </svg>
  <script src="generated/keymap-data.js"></script>
  <script src="app.js"></script>
</body>

</html>
