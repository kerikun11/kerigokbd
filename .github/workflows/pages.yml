name: Deploy KERIgoKBD Studio to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'
      - 'software/kerigokbd_studio/**'
      - 'software/qmk/keyboards/kerigokbd/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Generate keymap data
        run: |
          python3 software/kerigokbd_studio/scripts/build_layout.py
          python3 software/kerigokbd_studio/scripts/build_keycodes.py
          python3 software/kerigokbd_studio/scripts/build_defaults.py

      - name: Test generator
        run: node --test software/kerigokbd_studio/tests/*.test.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: software/kerigokbd_studio/public

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
